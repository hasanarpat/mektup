<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Small decorative flower for letter stickers -->
  <circle cx="40" cy="40" r="18" fill="#F4B8C8" opacity="0.8"/>
  <circle cx="40" cy="40" r="12" fill="#E896AA" opacity="0.9"/>
  <circle cx="40" cy="40" r="7" fill="#D4697E" opacity="0.95"/>
  <circle cx="40" cy="40" r="3" fill="#FFF0D4" opacity="1"/>
  
  <!-- Petals -->
  <ellipse cx="40" cy="18" rx="6" ry="10" fill="#F4B8C8" opacity="0.75"/>
  <ellipse cx="40" cy="62" rx="6" ry="10" fill="#F4B8C8" opacity="0.75"/>
  <ellipse cx="18" cy="40" rx="10" ry="6" fill="#F4B8C8" opacity="0.75"/>
  <ellipse cx="62" cy="40" rx="10" ry="6" fill="#F4B8C8" opacity="0.75"/>
  <ellipse cx="23" cy="23" rx="7" ry="10" fill="#F4B8C8" opacity="0.65" transform="rotate(45 23 23)"/>
  <ellipse cx="57" cy="23" rx="7" ry="10" fill="#F4B8C8" opacity="0.65" transform="rotate(-45 57 23)"/>
  <ellipse cx="23" cy="57" rx="7" ry="10" fill="#F4B8C8" opacity="0.65" transform="rotate(-45 23 57)"/>
  <ellipse cx="57" cy="57" rx="7" ry="10" fill="#F4B8C8" opacity="0.65" transform="rotate(45 57 57)"/>
  
  <!-- Leaves -->
  <ellipse cx="14" cy="55" rx="10" ry="4" fill="#7BA05B" opacity="0.6" transform="rotate(-35 14 55)"/>
  <ellipse cx="66" cy="55" rx="10" ry="4" fill="#7BA05B" opacity="0.6" transform="rotate(35 66 55)"/>
</svg>
