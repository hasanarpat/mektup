<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Left side garland -->
  <path d="M0 60 Q60 30 120 55 Q180 80 240 50 Q300 20 360 55 Q420 80 500 60" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Leaves along the vine -->
  <ellipse cx="50" cy="48" rx="12" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(-20 50 48)"/>
  <ellipse cx="110" cy="60" rx="11" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(15 110 60)"/>
  <ellipse cx="170" cy="75" rx="12" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(-10 170 75)"/>
  <ellipse cx="240" cy="52" rx="11" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(20 240 52)"/>
  <ellipse cx="310" cy="42" rx="12" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(-15 310 42)"/>
  <ellipse cx="370" cy="60" rx="11" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(10 370 60)"/>
  <ellipse cx="440" cy="55" rx="12" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(-20 440 55)"/>

  <!-- Flowers along vine - peach -->
  <circle cx="25" cy="62" r="9" fill="#F2C4A0" opacity="0.8"/>
  <circle cx="25" cy="62" r="5" fill="#E8A882" opacity="0.9"/>
  <circle cx="25" cy="62" r="2.5" fill="#D4896A" opacity="0.9"/>

  <!-- pink -->
  <circle cx="130" cy="52" r="10" fill="#F4B8C8" opacity="0.8"/>
  <circle cx="130" cy="52" r="6" fill="#E896AA" opacity="0.9"/>
  <circle cx="130" cy="52" r="3" fill="#D4697E" opacity="0.9"/>

  <!-- lavender -->
  <circle cx="245" cy="48" r="9" fill="#C9A8D4" opacity="0.8"/>
  <circle cx="245" cy="48" r="5" fill="#B48DC0" opacity="0.9"/>
  <circle cx="245" cy="48" r="2.5" fill="#8B5CA0" opacity="0.9"/>

  <!-- cream -->
  <circle cx="360" cy="52" r="9" fill="#FFF0D4" opacity="0.85"/>
  <circle cx="360" cy="52" r="5" fill="#F5D9A8" opacity="0.9"/>
  <circle cx="360" cy="52" r="2.5" fill="#E8C080" opacity="0.9"/>

  <!-- pink right -->
  <circle cx="480" cy="62" r="10" fill="#F4B8C8" opacity="0.8"/>
  <circle cx="480" cy="62" r="6" fill="#E896AA" opacity="0.9"/>
  <circle cx="480" cy="62" r="3" fill="#D4697E" opacity="0.9"/>

  <!-- Small accent flowers -->
  <circle cx="80" cy="65" r="5" fill="#F2C4A0" opacity="0.65"/>
  <circle cx="80" cy="65" r="2.5" fill="#E8A882" opacity="0.8"/>
  
  <circle cx="195" cy="55" r="5" fill="#C9A8D4" opacity="0.65"/>
  <circle cx="195" cy="55" r="2.5" fill="#B48DC0" opacity="0.8"/>

  <circle cx="305" cy="48" r="5" fill="#F4B8C8" opacity="0.65"/>
  <circle cx="305" cy="48" r="2.5" fill="#E896AA" opacity="0.8"/>

  <circle cx="415" cy="62" r="5" fill="#FFF0D4" opacity="0.7"/>
  <circle cx="415" cy="62" r="2.5" fill="#F5D9A8" opacity="0.85"/>

  <!-- Tiny buds -->
  <ellipse cx="60" cy="42" rx="3.5" ry="6" fill="#E8A882" opacity="0.55" transform="rotate(-15 60 42)"/>
  <ellipse cx="155" cy="78" rx="3" ry="5" fill="#F4B8C8" opacity="0.55" transform="rotate(10 155 78)"/>
  <ellipse cx="278" cy="72" rx="3.5" ry="5.5" fill="#C9A8D4" opacity="0.55" transform="rotate(-8 278 72)"/>
  <ellipse cx="390" cy="45" rx="3" ry="5" fill="#F2C4A0" opacity="0.55" transform="rotate(12 390 45)"/>
  <ellipse cx="450" cy="42" rx="3.5" ry="5.5" fill="#F4B8C8" opacity="0.55" transform="rotate(-10 450 42)"/>

  <!-- Dewdrops -->
  <circle cx="130" cy="43" r="2" fill="white" opacity="0.45"/>
  <circle cx="245" cy="40" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="360" cy="43" r="2" fill="white" opacity="0.45"/>
</svg>
