<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" fill="none">
  <!-- Main stem -->
  <path d="M100 380 Q90 320 85 260 Q78 200 88 140 Q95 80 100 20" stroke="#8B7355" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  
  <!-- Side branches -->
  <path d="M88 300 Q60 290 40 275" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M90 240 Q118 225 140 210" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M87 180 Q58 168 36 155" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M91 120 Q120 108 142 95" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Leaves -->
  <ellipse cx="55" cy="278" rx="14" ry="7" fill="#7BA05B" opacity="0.55" transform="rotate(-20 55 278)"/>
  <ellipse cx="135" cy="212" rx="13" ry="6" fill="#7BA05B" opacity="0.55" transform="rotate(15 135 212)"/>
  <ellipse cx="48" cy="158" rx="12" ry="6" fill="#7BA05B" opacity="0.55" transform="rotate(-25 48 158)"/>
  <ellipse cx="138" cy="97" rx="13" ry="6" fill="#7BA05B" opacity="0.55" transform="rotate(10 138 97)"/>
  <ellipse cx="95" cy="340" rx="10" ry="5" fill="#7BA05B" opacity="0.5" transform="rotate(5 95 340)"/>

  <!-- Flower 1 - peach rose at top -->
  <circle cx="100" cy="22" r="14" fill="#F2C4A0" opacity="0.85"/>
  <circle cx="100" cy="22" r="9" fill="#E8A882" opacity="0.9"/>
  <circle cx="100" cy="22" r="5" fill="#D4896A" opacity="0.9"/>
  <ellipse cx="86" cy="18" rx="7" ry="5" fill="#F2C4A0" opacity="0.7" transform="rotate(-30 86 18)"/>
  <ellipse cx="114" cy="18" rx="7" ry="5" fill="#F2C4A0" opacity="0.7" transform="rotate(30 114 18)"/>
  <ellipse cx="100" cy="10" rx="6" ry="4" fill="#F2C4A0" opacity="0.7"/>
  <ellipse cx="100" cy="34" rx="6" ry="4" fill="#F2C4A0" opacity="0.7"/>

  <!-- Flower 2 - lavender at branch tip -->
  <circle cx="38" cy="154" r="10" fill="#C9A8D4" opacity="0.8"/>
  <circle cx="38" cy="154" r="6" fill="#B48DC0" opacity="0.9"/>
  <circle cx="38" cy="154" r="3" fill="#8B5CA0" opacity="0.9"/>
  <ellipse cx="28" cy="150" rx="5" ry="3.5" fill="#C9A8D4" opacity="0.7" transform="rotate(-25 28 150)"/>
  <ellipse cx="48" cy="150" rx="5" ry="3.5" fill="#C9A8D4" opacity="0.7" transform="rotate(25 48 150)"/>
  <ellipse cx="38" cy="144" rx="4" ry="3" fill="#C9A8D4" opacity="0.7"/>

  <!-- Flower 3 - cream small at right -->
  <circle cx="143" cy="93" r="9" fill="#FFF0D4" opacity="0.85"/>
  <circle cx="143" cy="93" r="5" fill="#F5D9A8" opacity="0.9"/>
  <circle cx="143" cy="93" r="3" fill="#E8C080" opacity="0.9"/>
  <ellipse cx="134" cy="89" rx="5" ry="3" fill="#FFF0D4" opacity="0.7" transform="rotate(-20 134 89)"/>
  <ellipse cx="152" cy="89" rx="5" ry="3" fill="#FFF0D4" opacity="0.7" transform="rotate(20 152 89)"/>

  <!-- Buds -->
  <ellipse cx="40" cy="272" rx="5" ry="8" fill="#E8A882" opacity="0.6" transform="rotate(-10 40 272)"/>
  <ellipse cx="140" cy="207" rx="4" ry="7" fill="#C9A8D4" opacity="0.6" transform="rotate(8 140 207)"/>
  
  <!-- Tiny flowers -->
  <circle cx="92" cy="120" r="5" fill="#F2C4A0" opacity="0.75"/>
  <circle cx="92" cy="120" r="2.5" fill="#E8A882" opacity="0.9"/>

  <!-- Dewdrops -->
  <circle cx="62" cy="285" r="2" fill="white" opacity="0.5"/>
  <circle cx="130" cy="100" r="1.5" fill="white" opacity="0.5"/>
</svg>
